yamlname: Run Inline Bash
on: [push] # Triggers every time you push code

jobs:
  bash-job:
    runs-on: ubuntu-latest # Uses a Linux environment
    steps:
      - name: Run a single command
        run: echo "Hello from GitHub Actions!"

      - name: Run multi-line commands
        run: |
          echo "Current directory:"
          pwd
          ls -la
